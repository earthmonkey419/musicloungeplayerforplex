services:
  mlplayer:
    build: .
    container_name: mlplayer
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8680}:8680"
    env_file:
      - .env
    environment:
      # Internal container wiring, not a secret -- always matches the
      # volume mount below. Kept separate from .env, which is for
      # per-deployment secrets/preferences (see .env.example).
      - DB_PATH=/app/data/mlplayer.db
    volumes:
      - mlplayer-data:/app/data
      # Alternative to the env-var-based config entirely: mount a
      # real config.py directly instead. If you use this, the .env
      # file above becomes unnecessary (config.py wins either way,
      # since it's read directly rather than through the
      # REPLACE_ME-default template).
      # - ./config.py:/app/config.py:ro
      #
      # Only needed if MUSICMIND_DB_PATH is set in .env -- mount
      # MusicMind's plex_music_brain.db read-only at that same path.
      # - /path/on/host/plex_music_brain.db:/app/data/plex_music_brain.db:ro

volumes:
  mlplayer-data:
