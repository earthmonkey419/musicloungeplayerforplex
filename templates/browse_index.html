{% extends "base.html" %}
{% block title %}Browse — MusicLounge Player{% endblock %}
{% block body_class %}ml-player-theme{% endblock %}
{% block topbar %}{% include "partials/_player_nav.html" %}{% endblock %}
{% block content %}
<div class="pl-hero" style="padding: var(--pl-space-lg); margin-top: var(--pl-space-lg);">
  <h1 style="font-size:32px; line-height:40px; margin-bottom:var(--pl-space-md);">Browse</h1>

  <div style="display:flex; flex-wrap:wrap; gap:var(--pl-space-md); align-items:center;">
    <div class="pl-chip-row" style="margin:0;">
      <button class="mood-pill browse-type-btn" data-type="artists">Artists</button>
      <button class="mood-pill browse-type-btn" data-type="albums">Albums</button>
      <button class="mood-pill browse-type-btn" data-type="tracks">Tracks</button>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <label class="pl-caption" for="sort-select">Sort by</label>
      <select id="sort-select" class="pl-text-input" style="padding:8px 12px;"></select>
    </div>
  </div>
</div>

<div class="pl-results-section">
  <div id="browse-scroll" class="pl-results-scroll" style="max-height:70vh;">
    <div id="browse-grid" class="browse-grid"></div>
  </div>
  <div id="az-quickbar" class="az-quickbar" hidden></div>
  <button id="browse-play-all-btn" class="pl-link-btn" hidden>▶ Play All</button>
  <button id="browse-back-to-top" class="pl-back-to-top" hidden title="Back to top">↑ Top</button>
</div>

<div id="add-to-playlist-modal" class="pl-modal-overlay" hidden>
  <div class="pl-modal">
    <div class="pl-modal-header">
      <h3>Add to playlist</h3>
      <button id="atp-close" class="pl-link-btn" title="Close">✕</button>
    </div>
    <p id="atp-track-label" class="pl-small" style="margin: 0 0 var(--pl-space-sm);"></p>
    <ul id="atp-playlist-list" class="pl-modal-playlist-list"></ul>
    <div class="pl-modal-new-row">
      <input id="atp-new-name" type="text" placeholder="Or create a new playlist…">
      <button id="atp-new-btn" class="pl-btn pl-btn-mint">Create &amp; Add</button>
    </div>
  </div>
</div>

<script>
(function () {
const nativePlaylists = {{ playlists_for_modal | tojson }};

const SORT_OPTIONS = {
  artists: [
    { value: "title", label: "Name (A–Z)" },
    { value: "added", label: "Recently Added" },
  ],
  albums: [
    { value: "title", label: "Title (A–Z)" },
    { value: "artist", label: "Artist (A–Z)" },
    { value: "year", label: "Year (Newest)" },
    { value: "added", label: "Recently Added" },
  ],
  tracks: [
    { value: "title", label: "Title (A–Z)" },
    { value: "artist", label: "Artist (A–Z)" },
    { value: "album", label: "Album (A–Z)" },
  ],
};

const PAGE_SIZE = 48;
const params = new URLSearchParams(window.location.search);
let currentType = ["albums", "tracks"].includes(params.get("type")) ? params.get("type") : "artists";
let currentSort = params.get("sort") || "title";
let offset = 0;
let hasMore = true;
let loading = false;
let observer = null;
let allLoadedTracks = []; // only populated/used when currentType === "tracks"

const scrollEl = document.getElementById("browse-scroll");
const gridEl = document.getElementById("browse-grid");
const playAllBtn = document.getElementById("browse-play-all-btn");
playAllBtn.addEventListener("click", () => {
  MLPlayer.playQueue(allLoadedTracks, 0);
});
const backToTopBtn = document.getElementById("browse-back-to-top");
const sortSelect = document.getElementById("sort-select");
const typeButtons = document.querySelectorAll(".browse-type-btn");

const atpModal = document.getElementById("add-to-playlist-modal");
const atpTrackLabel = document.getElementById("atp-track-label");
const atpPlaylistList = document.getElementById("atp-playlist-list");
const atpNewName = document.getElementById("atp-new-name");
let atpCurrentTrack = null;

function updateUrl() {
  const p = new URLSearchParams();
  p.set("type", currentType);
  p.set("sort", currentSort);
  history.replaceState(null, "", `${window.location.pathname}?${p.toString()}`);
}

function populateSortOptions() {
  sortSelect.innerHTML = "";
  SORT_OPTIONS[currentType].forEach(opt => {
    const el = document.createElement("option");
    el.value = opt.value;
    el.textContent = opt.label;
    if (opt.value === currentSort) el.selected = true;
    sortSelect.appendChild(el);
  });
  if (!SORT_OPTIONS[currentType].some(o => o.value === currentSort)) {
    currentSort = SORT_OPTIONS[currentType][0].value;
    sortSelect.value = currentSort;
  }
}

function setActiveTypeButton() {
  typeButtons.forEach(btn => {
    btn.classList.toggle("mood-pill-active", btn.dataset.type === currentType);
  });
}

function artistTile(a) {
  const el = document.createElement("a");
  el.className = "browse-tile";
  el.href = `/browse/artist/${a.rating_key}`;
  el.innerHTML = `
    <img class="browse-tile-art browse-tile-art-round" src="/art/${a.rating_key}" alt="" onerror="this.style.visibility='hidden'">
    <div class="browse-tile-title">${a.title}</div>
  `;
  return el;
}

function albumTile(a) {
  const el = document.createElement("a");
  el.className = "browse-tile";
  el.href = `/browse/album/${a.rating_key}`;
  const subtitle = [a.artist, a.year].filter(Boolean).join(" · ");
  el.innerHTML = `
    <img class="browse-tile-art" src="/art/${a.rating_key}" alt="" onerror="this.style.visibility='hidden'">
    <div class="browse-tile-title">${a.title}</div>
    <div class="browse-tile-subtitle">${subtitle}</div>
  `;
  return el;
}

function trackRow(t, indexInAllLoaded) {
  const li = document.createElement("li");
  li.className = "track-row";
  li.innerHTML = `
    <img class="track-art" src="/art/${t.rating_key}" alt="">
    <div class="track-meta">
      <div class="track-title">${t.title}</div>
      <div class="track-artist">${t.artist}</div>
    </div>
    <button class="track-play" title="Play">▶</button>
    <button class="track-enqueue" title="Add to queue">⏬</button>
    <button class="track-add" title="Add to playlist">+</button>
    <button class="room-share-trigger" title="Room or Share">⋯</button>
  `;
  li.querySelector(".track-play").addEventListener("click", () => {
    MLPlayer.playTrack(t);
  });
  li.querySelector(".track-enqueue").addEventListener("click", () => MLPlayer.enqueue(t));
  li.querySelector(".track-add").addEventListener("click", () => openAddToPlaylist(t));
  li.querySelector(".room-share-trigger").addEventListener("click", (e) => {
    window.openRoomShareMenu(e.currentTarget, { type: "track", ref: t.rating_key, title: t.title, artist: t.artist });
  });
  return li;
}

function removeSentinel() {
  const s = document.getElementById("browse-sentinel");
  if (s) s.remove();
  if (observer) { observer.disconnect(); observer = null; }
}

function ensureSentinel() {
  removeSentinel();
  if (!hasMore) return;
  const sentinel = document.createElement("div");
  sentinel.id = "browse-sentinel";
  sentinel.style.height = "1px";
  gridEl.after(sentinel);
  observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && hasMore && !loading) loadPage();
  }, { root: scrollEl, rootMargin: "300px" });
  observer.observe(sentinel);
}

async function loadPage() {
  if (loading || !hasMore) return;
  loading = true;
  const endpoint = { artists: "/browse/api/artists", albums: "/browse/api/albums", tracks: "/browse/api/tracks" }[currentType];
  let data;
  try {
    const res = await fetch(`${endpoint}?offset=${offset}&limit=${PAGE_SIZE}&sort=${currentSort}`);
    data = await res.json();
    if (data.error) throw new Error(data.error);
  } catch (e) {
    loading = false;
    return;
  }
  if (currentType === "tracks") {
    data.results.forEach(t => {
      allLoadedTracks.push(t);
      gridEl.appendChild(trackRow(t, allLoadedTracks.length - 1));
    });
  } else {
    const tileFn = currentType === "albums" ? albumTile : artistTile;
    data.results.forEach(item => gridEl.appendChild(tileFn(item)));
  }
  hasMore = !!data.has_more;
  offset = typeof data.next_offset === "number" ? data.next_offset : offset + data.results.length;
  loading = false;
  ensureSentinel();
}

function resetAndLoad() {
  offset = 0;
  hasMore = true;
  allLoadedTracks = [];
  gridEl.className = currentType === "tracks" ? "track-list" : "browse-grid";
  gridEl.innerHTML = "";
  removeSentinel();
  scrollEl.scrollTop = 0;
  backToTopBtn.hidden = true;
  loadPage();
}

// --- A-Z quickbar ------------------------------------------------------
// Only meaningful when sorted by title -- jumping through a
// differently-sorted pool (year, date added, etc.) wouldn't land on a
// meaningful letter-ordered position. See result_cache.offset_for_letter()'s
// own docstring for the full reasoning.
const quickbarEl = document.getElementById("az-quickbar");
"#ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
  const btn = document.createElement("button");
  btn.className = "az-quickbar-letter";
  btn.textContent = letter;
  btn.addEventListener("click", () => jumpToLetter(letter));
  quickbarEl.appendChild(btn);
});

function updateQuickbarVisibility() {
  quickbarEl.hidden = currentSort !== "title";
}

function updatePlayAllVisibility() {
  playAllBtn.hidden = currentType !== "tracks";
}

async function jumpToLetter(letter) {
  if (loading) return;
  let data;
  try {
    const res = await fetch(`/browse/api/letter-offset?type=${currentType}&letter=${encodeURIComponent(letter)}`);
    data = await res.json();
    if (data.error) throw new Error(data.error);
  } catch (e) {
    return;
  }
  hasMore = true;
  allLoadedTracks = [];
  gridEl.className = currentType === "tracks" ? "track-list" : "browse-grid";
  gridEl.innerHTML = "";
  removeSentinel();
  scrollEl.scrollTop = 0;
  backToTopBtn.hidden = true;
  offset = typeof data.offset === "number" ? data.offset : 0;
  loadPage();
}

function openAddToPlaylist(track) {
  atpCurrentTrack = track;
  atpTrackLabel.textContent = `"${track.title}" — ${track.artist}`;
  atpNewName.value = "";
  renderPlaylistPickerList();
  atpModal.hidden = false;
}
window.openAddToPlaylist = openAddToPlaylist;
function closeAddToPlaylist() { atpModal.hidden = true; atpCurrentTrack = null; }

function renderPlaylistPickerList() {
  atpPlaylistList.innerHTML = "";
  if (!nativePlaylists.length) {
    atpPlaylistList.innerHTML = '<li class="empty">No playlists yet -- create one below.</li>';
    return;
  }
  nativePlaylists.forEach(p => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "pl-modal-playlist-btn";
    btn.textContent = p.name;
    btn.addEventListener("click", () => addTrackToPlaylist(p.id, p.name));
    li.appendChild(btn);
    atpPlaylistList.appendChild(li);
  });
}

function addTrackToPlaylist(playlistId, playlistName) {
  fetch(`/playlists/api/${playlistId}/add-track`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({rating_key: atpCurrentTrack.rating_key}),
  })
    .then(r => r.json())
    .then(data => {
      if (data.ok) closeAddToPlaylist();
      else alert(data.error || "Couldn't add that track.");
    })
    .catch(() => alert("Something went wrong adding that track."));
}

document.getElementById("atp-close").addEventListener("click", closeAddToPlaylist);
atpModal.addEventListener("click", (e) => { if (e.target === atpModal) closeAddToPlaylist(); });

document.getElementById("atp-new-btn").addEventListener("click", () => {
  const name = atpNewName.value.trim();
  if (!name) return;
  fetch("{{ url_for('playlists.api_create') }}", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name}),
  })
    .then(r => r.json())
    .then(data => {
      if (!data.ok) { alert(data.error || "Couldn't create playlist."); return; }
      nativePlaylists.push({id: data.playlist_id, name: name, source: "native"});
      addTrackToPlaylist(data.playlist_id, name);
    });
});

typeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.type === currentType) return;
    currentType = btn.dataset.type;
    populateSortOptions();
    setActiveTypeButton();
    updateUrl();
    updateQuickbarVisibility();
    updatePlayAllVisibility();
    resetAndLoad();
  });
});

sortSelect.addEventListener("change", () => {
  currentSort = sortSelect.value;
  updateUrl();
  updateQuickbarVisibility();
  updatePlayAllVisibility();
  resetAndLoad();
});

scrollEl.addEventListener("scroll", () => {
  backToTopBtn.hidden = scrollEl.scrollTop < 300;
});
backToTopBtn.addEventListener("click", () => scrollEl.scrollTo({ top: 0, behavior: "smooth" }));

populateSortOptions();
setActiveTypeButton();
gridEl.className = currentType === "tracks" ? "track-list" : "browse-grid";
updateUrl();
updateQuickbarVisibility();
updatePlayAllVisibility();
loadPage();

// SPA-nav teardown -- disconnects the IntersectionObserver before
// this page's content is swapped out.
window.__spaTeardown = function () {
  removeSentinel();
};
})();
</script>
{% endblock %}
