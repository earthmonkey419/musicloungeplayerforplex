<div id="pl-mobile-menu" class="pl-mobile-menu">
  <a href="{{ url_for('player.index') }}#search-input" class="pl-mobile-menu-link">Search</a>
  <a href="{{ url_for('browse.artists') }}" class="pl-mobile-menu-link">Browse</a>
  <a href="{{ url_for('admin.dashboard') }}" class="pl-mobile-menu-link">Rooms</a>
  <a href="{{ url_for('share.new_share') }}" class="pl-mobile-menu-link">Share</a>
  <a href="{{ url_for('playlists.index') }}" class="pl-mobile-menu-link">Playlists</a>
  <a href="{{ url_for('admin.stats') }}" class="pl-mobile-menu-link">Settings</a>
  <a href="{{ url_for('player.help_page') }}" class="pl-mobile-menu-link">Help</a>
  <a href="{{ url_for('admin.logout') }}" class="pl-mobile-menu-link" data-full-reload>Log out</a>
</div>

<script>
(function () {
  const btn = document.getElementById("pl-hamburger-btn");
  const menu = document.getElementById("pl-mobile-menu");
  if (!btn || !menu) return;

  function setOpen(open) {
    menu.classList.toggle("pl-mobile-menu-open", open);
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? "✕" : "☰";
  }

  btn.addEventListener("click", () => {
    setOpen(!menu.classList.contains("pl-mobile-menu-open"));
  });

  menu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => setOpen(false));
  });
})();
</script>
